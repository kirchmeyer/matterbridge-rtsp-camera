name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove credentials, pairing codes, and private RTSP URLs from all logs.
  - type: input
    id: version
    attributes:
      label: Plugin version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Matterbridge, Node.js, and operating system versions
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Protocol mode
      options:
        - Matter
        - HomeKit
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      render: shell